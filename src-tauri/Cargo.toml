[package]
name = "maeclyprint"
version = "0.0.1"
description = "Open source batch file printing for Windows and macOS."
authors = ["Maecly maintainers"]
license = "GPL-3.0-only"
repository = "https://github.com/MAECLY/maecly-print"
edition = "2021"
rust-version = "1.78"

[lib]
name = "maeclyprint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# --- Tauri 2 ---
tauri = { version = "2.1", features = [] }

# --- Serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# --- Async runtime ---
tokio = { version = "1.41", features = ["full"] }

# --- Logging / tracing ---
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# --- Errors ---
thiserror = "2"
anyhow = "1"

# --- Filesystem / paths ---
directories = "5"
tempfile = "3"

# --- Update check + issue reporting ---
# Semantic-version comparison for the GitHub-release update check.
semver = "1"
# Minimal blocking HTTP client for the GitHub releases API (no async runtime
# pulled into the update path); JSON feature for the release payload.
ureq = { version = "2.12", features = ["json"] }
# Percent-encode the prefilled "report issue" GitHub URL query.
percent-encoding = "2.3"

# --- Typed IPC bindings (frontend ↔ Rust) ---
# Pinned exact versions: tauri-specta is pre-release; semver wildcards risk drift.
specta = { version = "=2.0.0-rc.22", features = ["derive"] }
specta-typescript = "=0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
# Core PDF building only — no `html` default (drops azul-layout/kuchiki/etc.).
printpdf = { version = "0.9.1", default-features = false }

# --- Print engine (M1) ---
# Pure-Rust image decoding for the image→PDF converter; codecs only, no extras.
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "tiff",
  "bmp",
  "webp",
] }
# PDF parsing: page counts for the Print Job screen + converter test assertions.
lopdf = "0.34"
# Job ids: v7 is time-sortable, so queue ordering falls out of the id.
uuid = { version = "1", features = ["v7"] }
# RFC3339 job timestamps serialized into queue.json.
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

# --- Tauri plugins ---
tauri-plugin-dialog = "2"
# Open URLs / reveal folders in the OS default handler (logs folder, issue
# reporter, external links). Called Rust-side only; no JS capability needed.
tauri-plugin-opener = "2"

# --- Dev/test only ---
# `test-util` unlocks tokio's virtual clock (`start_paused` / `time::advance`)
# so the dispatcher's retry-backoff tests are deterministic and instant. Only
# compiled for tests; the release build never sees it.
[dev-dependencies]
tokio = { version = "1.41", features = ["test-util"] }

# --- Windows printer enumeration (winspool + GDI DeviceCapabilities) ---
# Only pulled in on Windows targets; macOS/Linux enumerate via the CUPS CLI.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Printing",
  "Win32_Security",
  "Win32_Storage_Xps",
] }

[features]
# By default Tauri uses "custom-protocol" in release builds. Tauri's CLI passes this in.
custom-protocol = ["tauri/custom-protocol"]

[profile.dev]
# Faster incremental builds during dev
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
