# Weekly dependency updates, one pull request per ecosystem for every minor
# and patch release, and majors on their own.
#
# - Titles: `prefix` plus `include: scope` gives "chore(deps): ...",
#   "chore(deps-dev): ..." and "ci(deps): ..." (Dependabot adds the scope;
#   a prefix that already carries one would read "chore(deps)(deps): ...").
# - Groups: a dependency joins the first group that matches it. The
#   `*-minor-patch` group comes first and takes every minor and patch
#   release; the groups after it only see majors, so related packages that
#   must move together (tauri and its plugins, react and its types, the
#   eslint toolchain, vite and its React plugin, vitest and its DOM,
#   WebdriverIO, commitlint) still arrive in one pull request, and any other
#   major arrives alone.
# - Cooldown: a release is proposed once it is a week old, so a compromised or
#   yanked version has time to be caught before it reaches a pull request.
# - GitHub Actions stay pinned to full commit SHAs; Dependabot moves the SHA
#   and the version comment after it together.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      tauri:
        patterns:
          - 'tauri*'
          - 'specta*'
    ignore:
      # lopdf must stay on the line printpdf is built on: printpdf 0.12.8
      # (the newest) requires lopdf ^0.44, so a 0.45 bump alone puts two
      # lopdf copies in the tree (#41). Patch releases of 0.44 still come
      # through. Remove this when a printpdf release moves to a newer lopdf,
      # and move both together.
      - dependency-name: lopdf
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # The windows-rs crates must stay on the line tauri's wry and
      # webview2-com are generated against (0.62 for tauri 2.12 / webview2-com
      # 0.39): the render worker hands our IStream and HSTRING to webview2-com,
      # and another line neither shares those types nor avoids a second copy
      # of the bindings (#54 proposed windows-core 0.100). Patch releases of
      # 0.62 still come through. Move both with tauri, when webview2-com does.
      - dependency-name: windows
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: windows-core
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # usvg and pdf-writer must stay on the lines svg2pdf is built on: the SVG
      # path parses with our usvg and hands the tree to svg2pdf, which writes
      # it with its pdf-writer. svg2pdf 0.13.0 (the newest) requires usvg ^0.45
      # and pdf-writer ^0.12, so usvg 0.48 (#55) or pdf-writer 0.15 (#51) alone
      # puts a second copy in the tree and the usvg types no longer match.
      # Remove these when an svg2pdf release moves, and move all three together.
      - dependency-name: usvg
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: pdf-writer
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      # Everything else that uses base64 (reqwest, hyper-util, printpdf, usvg,
      # tauri-plugin-updater) is on 0.22, so 0.23 (#52) only adds a second copy
      # for our two encode/decode calls. Revisit when reqwest and the updater
      # plugin move.
      - dependency-name: base64
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      tauri:
        patterns:
          - '@tauri-apps/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
          - '@typescript-eslint/*'
          - 'globals'
      vite:
        patterns:
          - 'vite'
          - '@vitejs/*'
      vitest:
        patterns:
          - 'vitest'
          - '@vitest/*'
          - '@testing-library/*'
          - 'jsdom'
      wdio:
        patterns:
          - '@wdio/*'
      commitlint:
        patterns:
          - '@commitlint/*'
    ignore:
      # Tailwind CSS 4 needs Safari 16.4 or later: its output relies on
      # @property and on range-syntax media queries such as
      # `@media (width >= 40rem)`, which have no fallback. tauri.conf.json
      # supports macOS 13.0, and macOS 13.0 to 13.2 ship the WKWebView of
      # Safari 16.0 to 16.3; vite also builds for safari13. The app also uses no Tailwind
      # utilities (every class is an mp-* class of its own), so a v4
      # migration would add that risk and change nothing visible. Minor and
      # patch releases of 3.x still come through. Revisit when the macOS
      # floor reaches 13.3 or Tailwind is dropped.
      - dependency-name: tailwindcss
        update-types:
          - version-update:semver-major
      # @types/node follows the oldest Node.js the project supports (engines
      # >=22.22.2), so the type checker rejects APIs that release lacks; types
      # for Node 26 (#56) would accept them. Minor and patch releases of 22.x
      # still come through. Move the major with the engines floor.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
    ignore:
      # v5 is v4.4.0 again (both run on Node.js 24); v6 installs pnpm 11
      # first and then self-updates to the packageManager pin, which has
      # failed intermittently with ERR_PNPM_PNPM_ENGINE_IDENTITY_MISMATCH
      # (pnpm/action-setup#268) and would put a second pnpm download in
      # front of every release build. Revisit when package.json moves to
      # pnpm 11 or the action installs the pinned version directly.
      - dependency-name: pnpm/action-setup
        update-types:
          - version-update:semver-major
