name: Feature request
description: Propose a new capability or improvement
title: 'feat: '
labels: ['enhancement', 'needs-triage']
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, please check `docs/05-features/` and `docs/06-roadmap/` to see whether your idea is already planned.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user need or pain point.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: A short description of how you imagine this working.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why you ruled them out.

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Print engine (formats, conversion)
        - Shell integration (context menu)
        - GUI / UX
        - CLI
        - Profiles / settings
        - Auto-update
        - Installer / packaging
        - Documentation
        - Other
    validations:
      required: true
