# The checks a pull request must pass: lint, typecheck, format, tests and a
# dependency audit for the frontend, and fmt, clippy, tests and a dependency
# audit for the Rust backend on the two platforms Pluryprint ships for. Nothing here builds an installer or reads a
# secret; release.yml builds, measures and signs the shipped artifacts (and
# checks THIRD-PARTY-NOTICES.md before it does).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Every job only reads the repository; none publishes anything.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + typecheck + format + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      # Known vulnerabilities in what ships in the bundle. Dev-only
      # advisories that cannot be fixed yet are listed, with reasons, in
      # docs/07-build-and-release/ci-cd.md (package.json auditConfig).
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  # The Rust code is heavily cfg-gated (WinSpool and the Explorer handler on
  # Windows, CUPS on macOS), so it is checked on both shipped platforms.
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      # A test run never moves a MaeclyPrint-era data directory (ADR-0009).
      PLURYPRINT_SKIP_MIGRATION: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup is on every hosted runner, so the toolchain needs no action
      # (as in release.yml).
      - name: Install Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            shell-ext-win/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock', 'shell-ext-win/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Known vulnerabilities (RustSec) in both locked trees. Fails on any
      # advisory not ignored, with its reason, in src-tauri/.cargo/audit.toml.
      # The lockfiles are the same on every runner: once is enough.
      - name: Install cargo-audit
        if: runner.os == 'macOS'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-audit@0.22.2

      - name: cargo audit
        if: runner.os == 'macOS'
        working-directory: src-tauri
        run: cargo audit

      - name: cargo audit (shell extension)
        if: runner.os == 'macOS'
        working-directory: shell-ext-win
        run: cargo audit

      # Formatting does not depend on the platform: once is enough.
      - name: cargo fmt
        if: runner.os == 'Windows'
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path shell-ext-win/Cargo.toml --all -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # A full run, never filtered: tests/ipc_surface.rs regenerates
      # src/ipc/bindings.ts and fails when the committed copy is stale.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The Explorer context-menu DLL is its own crate (own target dir, own
      # `panic = "unwind"` release profile), and its COM layer only builds
      # on Windows.
      - name: cargo clippy (shell extension)
        if: runner.os == 'Windows'
        run: cargo clippy --manifest-path shell-ext-win/Cargo.toml --all-targets -- -D warnings

      - name: cargo test (shell extension)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path shell-ext-win/Cargo.toml
