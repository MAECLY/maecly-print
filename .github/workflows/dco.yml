name: DCO

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  dco:
    name: DCO sign-off check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all commits are signed off
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          UNSIGNED=$(git log --no-merges --format='%H %s%n%b' "$BASE..$HEAD" | awk '
            /^[a-f0-9]{40} / { sha=$1; signed=0; next }
            /^Signed-off-by: / { signed=1 }
            /^$/ { if (sha && !signed) print sha; sha="" }
            END { if (sha && !signed) print sha }
          ')
          if [ -n "$UNSIGNED" ]; then
            echo "::error::The following commits are missing 'Signed-off-by:' lines:"
            echo "$UNSIGNED"
            exit 1
          fi
